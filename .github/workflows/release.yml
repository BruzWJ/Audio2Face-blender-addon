name: Release platform extensions

on:
  workflow_dispatch:

concurrency:
  group: audio2face-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate source and prepare draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      windows_asset: ${{ steps.identity.outputs.windows_asset }}
      linux_asset: ${{ steps.identity.outputs.linux_asset }}
      source_sha: ${{ steps.stamp.outputs.source_sha }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Check out selected branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Validate source and derive package identity
        id: identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from datetime import UTC, datetime
          from pathlib import Path

          manifest_path = Path("audio2face/blender_manifest.toml")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          manifest = tomllib.loads(manifest_text)
          extension_id = manifest.get("id")
          if extension_id != "audio2face":
              raise SystemExit(f"unexpected extension id: {extension_id!r}")
          stable_semver = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          current_version = manifest.get("version")
          if (
              not isinstance(current_version, str)
              or re.fullmatch(stable_semver, current_version) is None
          ):
              raise SystemExit(f"invalid source extension version: {current_version!r}")
          dispatch_ref = os.environ.get("DISPATCH_REF", "")
          expected_ref = f"refs/heads/{os.environ.get('DEFAULT_BRANCH', '')}"
          if dispatch_ref != expected_ref:
              raise SystemExit(
                  "manual releases must use the repository default branch in the "
                  f"Run workflow selector; expected {expected_ref!r}, got {dispatch_ref!r}"
              )
          source_sha = subprocess.run(
              ["git", "rev-parse", "--verify", "HEAD^{commit}"],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          ).stdout.strip()
          dispatch_sha = os.environ.get("DISPATCH_SHA")
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("Git did not resolve a canonical SHA-1 source identity")
          if source_sha != dispatch_sha:
              raise SystemExit(
                  f"checked-out source differs from dispatch SHA: {source_sha!r} != {dispatch_sha!r}"
              )
          release_day = datetime.now(UTC).date()
          version = f"{release_day.year}.{release_day.month}.{release_day.day}"
          release_tag = f"v{version}"
          version_pattern = re.compile(r'^version = "[^"]+"$', re.MULTILINE)
          if len(version_pattern.findall(manifest_text)) != 1:
              raise SystemExit("manifest must contain exactly one canonical version assignment")
          stamped_manifest = version_pattern.sub(
              f'version = "{version}"',
              manifest_text,
          )
          manifest_path.write_text(stamped_manifest, encoding="utf-8")
          outputs = {
              "version": version,
              "release_tag": release_tag,
              "windows_asset": f"{extension_id}-{version}-windows-x64.zip",
              "linux_asset": f"{extension_id}-{version}-linux-x64.zip",
              "dispatch_sha": source_sha,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for name, value in outputs.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Compare selected source with latest release
        shell: bash
        env:
          CURRENT_VERSION: ${{ steps.identity.outputs.version }}
          DISPATCH_SHA: ${{ steps.identity.outputs.dispatch_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          previous_tag="$(
            gh api graphql \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f query='query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  latestRelease { tagName }
                }
              }' \
              --jq '.data.repository.latestRelease.tagName // ""'
          )"

          if [[ -n "$previous_tag" ]]; then
            git check-ref-format "refs/tags/$previous_tag"
            previous_sha="$(git rev-parse --verify "refs/tags/$previous_tag^{commit}")"
            if ! git merge-base --is-ancestor "$previous_sha" "$DISPATCH_SHA"; then
              echo "Latest release $previous_tag ($previous_sha) is not an ancestor of selected source $DISPATCH_SHA." >&2
              exit 1
            fi
            commit_count="$(git rev-list --count "$previous_sha..$DISPATCH_SHA")"
            if [[ ! "$commit_count" =~ ^[1-9][0-9]*$ ]]; then
              echo "Selected source has no commits after latest release $previous_tag." >&2
              exit 1
            fi
            previous_manifest="$RUNNER_TEMP/previous-blender-manifest.toml"
            git show "$previous_sha:audio2face/blender_manifest.toml" > "$previous_manifest"
            PREVIOUS_MANIFEST="$previous_manifest" python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          stable_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
          )

          def parse_version(value: object, label: str) -> tuple[int, int, int]:
              if not isinstance(value, str) or stable_semver.fullmatch(value) is None:
                  raise SystemExit(f"{label} has invalid stable semantic version {value!r}")
              return tuple(int(part) for part in value.split("."))

          previous = tomllib.loads(
              Path(os.environ["PREVIOUS_MANIFEST"]).read_text(encoding="utf-8")
          )
          if previous.get("id") != "audio2face":
              raise SystemExit("latest release tag does not contain the Audio2Face manifest")
          previous_version = parse_version(previous.get("version"), "latest release manifest")
          current_version = parse_version(os.environ["CURRENT_VERSION"], "generated dated manifest")
          if current_version <= previous_version:
              raise SystemExit(
                  "generated dated manifest version must be newer than the latest release: "
                  f"{os.environ['CURRENT_VERSION']} <= {previous.get('version')}"
              )
          PY
            rm -f -- "$previous_manifest"
          fi

      - name: Run source tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pytest==7.2.1"
          python -m pytest -q

      - name: Commit dated manifest to selected branch
        id: stamp
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ steps.identity.outputs.dispatch_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          set -euo pipefail
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          qualified_branch="refs/heads/$DEFAULT_BRANCH"

          query_branch() {
            # shellcheck disable=SC2016
            gh api graphql \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f qualified="$qualified_branch" \
              -f query='query($owner: String!, $name: String!, $qualified: String!) {
                repository(owner: $owner, name: $name) {
                  ref(qualifiedName: $qualified) { target { oid } }
                }
              }' \
              --jq '.data.repository.ref.target.oid // ""'
          }

          branch_sha="$(query_branch)"
          if [[ ! "$branch_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Default branch did not resolve to a canonical commit SHA: ${branch_sha:-missing}." >&2
            exit 1
          fi
          manifest_path="audio2face/blender_manifest.toml"
          if [[ "$branch_sha" != "$DISPATCH_SHA" ]]; then
            resumed_json="$RUNNER_TEMP/resumed-manifest-commit.json"
            gh api "repos/$GITHUB_REPOSITORY/commits/$branch_sha" > "$resumed_json"
            RESUMED_JSON="$resumed_json" \
            BRANCH_SHA="$branch_sha" \
            STAMPED_BLOB_SHA="$(git hash-object "$manifest_path")" \
            MANIFEST_PATH="$manifest_path" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          commit = json.loads(
              Path(os.environ["RESUMED_JSON"]).read_text(encoding="utf-8")
          )
          expected_message = f"chore(release): {os.environ['RELEASE_TAG']}"
          parents = commit.get("parents")
          files = commit.get("files")
          if commit.get("sha") != os.environ["BRANCH_SHA"]:
              raise SystemExit("Default branch query and resumed commit identity differ")
          if (
              not isinstance(parents, list)
              or len(parents) != 1
              or not isinstance(parents[0], dict)
              or parents[0].get("sha") != os.environ["DISPATCH_SHA"]
          ):
              raise SystemExit("Default branch moved beyond the dispatch source")
          if commit.get("commit", {}).get("message") != expected_message:
              raise SystemExit("Default branch child is not this run's dated manifest commit")
          if (
              not isinstance(files, list)
              or len(files) != 1
              or not isinstance(files[0], dict)
              or files[0].get("filename") != os.environ["MANIFEST_PATH"]
              or files[0].get("sha") != os.environ["STAMPED_BLOB_SHA"]
          ):
              raise SystemExit("Default branch child does not contain the exact dated manifest")
          PY
            rm -f -- "$resumed_json"
            source_sha="$branch_sha"
          elif git diff --quiet -- "$manifest_path"; then
            source_sha="$DISPATCH_SHA"
          else
            mapfile -t changed_paths < <(git diff --name-only)
            if (( ${#changed_paths[@]} != 1 )) || [[ "${changed_paths[0]}" != "$manifest_path" ]]; then
              echo "Dated release stamping may only change $manifest_path." >&2
              printf 'Changed path: %s\n' "${changed_paths[@]}" >&2
              exit 1
            fi
            request_json="$RUNNER_TEMP/create-manifest-commit.json"
            response_json="$RUNNER_TEMP/create-manifest-commit-response.json"
            stamped_blob_sha="$(git hash-object "$manifest_path")"
            MANIFEST_PATH="$manifest_path" \
            python - <<'PY' > "$request_json"
          import base64
          import json
          import os
          from pathlib import Path

          manifest_path = Path(os.environ["MANIFEST_PATH"])
          print(json.dumps({
              "query": """
                  mutation($input: CreateCommitOnBranchInput!, $path: String!) {
                    createCommitOnBranch(input: $input) {
                      commit {
                        oid
                        parents(first: 2) {
                          totalCount
                          nodes { oid }
                        }
                        file(path: $path) {
                          path
                          type
                          oid
                          object { __typename oid }
                        }
                      }
                      ref {
                        name
                        prefix
                        target { __typename oid }
                      }
                    }
                  }
              """,
              "variables": {
                  "path": manifest_path.as_posix(),
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                          "branchName": os.environ["DEFAULT_BRANCH"],
                      },
                      "expectedHeadOid": os.environ["DISPATCH_SHA"],
                      "message": {
                          "headline": f"chore(release): {os.environ['RELEASE_TAG']}"
                      },
                      "fileChanges": {
                          "additions": [{
                              "path": manifest_path.as_posix(),
                              "contents": base64.b64encode(
                                  manifest_path.read_bytes()
                              ).decode("ascii"),
                          }]
                      },
                  }
              },
          }))
          PY
            gh api graphql --input "$request_json" > "$response_json"
            source_sha="$(
              RESPONSE_JSON="$response_json" \
              STAMPED_BLOB_SHA="$stamped_blob_sha" \
              MANIFEST_PATH="$manifest_path" \
              python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          response = json.loads(
              Path(os.environ["RESPONSE_JSON"]).read_text(encoding="utf-8")
          )
          try:
              payload = response["data"]["createCommitOnBranch"]
              commit = payload["commit"]
              updated_ref = payload["ref"]
          except (KeyError, TypeError) as error:
              raise SystemExit("Create commit response has an invalid GraphQL shape") from error
          source_sha = commit.get("oid")
          if not isinstance(source_sha, str) or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit(f"Create commit returned invalid SHA {source_sha!r}")
          parent_connection = commit.get("parents", {})
          parents = parent_connection.get("nodes")
          if (
              parent_connection.get("totalCount") != 1
              or not isinstance(parents, list)
              or len(parents) != 1
              or not isinstance(parents[0], dict)
              or parents[0].get("oid") != os.environ["DISPATCH_SHA"]
          ):
              raise SystemExit("Dated manifest commit is not a direct child of dispatch source")
          committed_file = commit.get("file")
          if (
              not isinstance(committed_file, dict)
              or committed_file.get("path") != os.environ["MANIFEST_PATH"]
              or committed_file.get("type") != "blob"
              or committed_file.get("oid") != os.environ["STAMPED_BLOB_SHA"]
              or committed_file.get("object", {}).get("__typename") != "Blob"
              or committed_file.get("object", {}).get("oid") != os.environ["STAMPED_BLOB_SHA"]
          ):
              raise SystemExit("Committed manifest bytes differ from the tested manifest")
          if (
              updated_ref.get("prefix") != "refs/heads/"
              or updated_ref.get("name") != os.environ["DEFAULT_BRANCH"]
              or updated_ref.get("target", {}).get("__typename") != "Commit"
              or updated_ref.get("target", {}).get("oid") != source_sha
          ):
              raise SystemExit("Updated branch ref does not identify dated manifest commit")
          print(source_sha, end="")
          PY
            )"
            rm -f -- "$request_json" "$response_json"
            branch_sha="$(query_branch)"
            if [[ "$branch_sha" != "$source_sha" ]]; then
              echo "Default branch does not identify dated manifest commit $source_sha; got ${branch_sha:-missing}." >&2
              exit 1
            fi
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create or verify dated draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.stamp.outputs.source_sha }}
        run: |
          set -euo pipefail
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          tag_state="$(
            gh api graphql \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f qualified="refs/tags/$RELEASE_TAG" \
              -f query='query($owner: String!, $name: String!, $qualified: String!) {
                repository(owner: $owner, name: $name) {
                  ref(qualifiedName: $qualified) { target { __typename oid } }
                }
              }' \
              --jq '.data.repository.ref.target // {} |
                if .oid == null then "" else [.__typename, .oid] | @tsv end'
          )"
          if [[ -n "$tag_state" ]]; then
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_state"
            if [[ "$tag_type" != "Commit" || "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "Existing release tag must be a lightweight tag at $SOURCE_SHA; got $tag_type $tag_sha." >&2
              exit 1
            fi
          fi
          releases_json="$RUNNER_TEMP/releases.json"
          # shellcheck disable=SC2016
          gh api graphql --paginate --slurp \
            -f owner="$repository_owner" \
            -f name="$repository_name" \
            -f query='query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                releases(
                  first: 100
                  after: $endCursor
                  orderBy: {field: CREATED_AT, direction: DESC}
                ) {
                  nodes {
                    databaseId
                    tagName
                    name
                    isDraft
                    isPrerelease
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }' > "$releases_json"
          release_id="$(RELEASES_JSON="$releases_json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          pages = json.loads(
              Path(os.environ["RELEASES_JSON"]).read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(not isinstance(page, dict) for page in pages):
              raise SystemExit("GitHub releases response is not a paginated GraphQL array")
          try:
              releases = [
                  release
                  for page in pages
                  for release in page["data"]["repository"]["releases"]["nodes"]
              ]
          except (KeyError, TypeError) as error:
              raise SystemExit("GitHub releases response has an invalid GraphQL shape") from error
          if any(not isinstance(release, dict) for release in releases):
              raise SystemExit("GitHub releases response contains a non-object")
          pending = [
              release.get("tagName")
              for release in releases
              if release.get("isDraft") is True
              and release.get("tagName") != os.environ["RELEASE_TAG"]
          ]
          if pending:
              raise SystemExit(
                  "resolve pending draft releases before continuing: "
                  + ", ".join(repr(tag) for tag in pending)
              )
          matches = [
              release
              for release in releases
              if release.get("tagName") == os.environ["RELEASE_TAG"]
          ]
          if matches:
              if len(matches) != 1:
                  raise SystemExit("generated tag resolves to multiple releases")
              release = matches[0]
              if release.get("isDraft") is not True:
                  raise SystemExit(
                      f"release {os.environ['RELEASE_TAG']} already exists and is not a draft"
                  )
              if release.get("isPrerelease") is not False:
                  raise SystemExit("existing draft must not be a prerelease")
              expected_name = f"Audio2Face {os.environ['RELEASE_TAG']}"
              if release.get("name") != expected_name:
                  raise SystemExit(
                      f"existing draft name must be {expected_name!r}; "
                      f"got {release.get('name')!r}"
                  )
              release_id = release.get("databaseId")
              if (
                  isinstance(release_id, bool)
                  or not isinstance(release_id, int)
                  or release_id <= 0
              ):
                  raise SystemExit(f"existing draft has invalid release ID {release_id!r}")
              print(release_id, end="")
          PY
          )"
          if [[ -n "$release_id" ]]; then
            existing="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --jq '[.id, .tag_name, .target_commitish, .name, .draft, .prerelease] | @tsv'
            )"
            IFS=$'\t' read -r existing_id existing_tag existing_target existing_name draft prerelease \
              <<< "$existing"
            if [[ "$existing_id" != "$release_id" || "$existing_tag" != "$RELEASE_TAG" ||
                  "$existing_name" != "Audio2Face $RELEASE_TAG" || "$draft" != "true" ||
                  "$prerelease" != "false" ]]; then
              echo "Existing draft REST identity does not match the dated release." >&2
              exit 1
            fi
            if [[ "$existing_target" != "$SOURCE_SHA" ]]; then
              if [[ ! "$existing_target" =~ ^[0-9a-f]{40}$ ]] ||
                 ! git cat-file -e "$existing_target^{commit}" ||
                 ! git merge-base --is-ancestor "$existing_target" "$SOURCE_SHA"; then
                echo "Existing draft target must be a commit ancestor of $SOURCE_SHA; got $existing_target." >&2
                exit 1
              fi
              generated_notes="$RUNNER_TEMP/generated-release-notes.json"
              release_update="$RUNNER_TEMP/update-draft-release.json"
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                --raw-field tag_name="$RELEASE_TAG" \
                --raw-field target_commitish="$SOURCE_SHA" > "$generated_notes"
              GENERATED_NOTES="$generated_notes" python - <<'PY' > "$release_update"
          import json
          import os
          from pathlib import Path

          generated = json.loads(
              Path(os.environ["GENERATED_NOTES"]).read_text(encoding="utf-8")
          )
          body = generated.get("body")
          if not isinstance(body, str):
              raise SystemExit("generated release notes returned no text body")
          print(json.dumps({
              "target_commitish": os.environ["SOURCE_SHA"],
              "body": body,
          }))
          PY
              retargeted="$(
                gh api --method PATCH \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                  --input "$release_update" \
                  --jq '[.id, .tag_name, .target_commitish, .name, .draft, .prerelease] | @tsv'
              )"
              rm -f -- "$generated_notes" "$release_update"
              IFS=$'\t' read -r updated_id updated_tag updated_target updated_name updated_draft updated_prerelease \
                <<< "$retargeted"
              if [[ "$updated_id" != "$release_id" || "$updated_tag" != "$RELEASE_TAG" ||
                    "$updated_target" != "$SOURCE_SHA" ||
                    "$updated_name" != "Audio2Face $RELEASE_TAG" ||
                    "$updated_draft" != "true" || "$updated_prerelease" != "false" ]]; then
                echo "Retargeted draft REST identity does not match the dated release." >&2
                exit 1
              fi
            fi
          else
            created_json="$RUNNER_TEMP/created-release.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              --raw-field tag_name="$RELEASE_TAG" \
              --raw-field target_commitish="$SOURCE_SHA" \
              --raw-field name="Audio2Face $RELEASE_TAG" \
              --field draft=true \
              --field prerelease=false \
              --field generate_release_notes=true > "$created_json"
            release_id="$(CREATED_JSON="$created_json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              Path(os.environ["CREATED_JSON"]).read_text(encoding="utf-8")
          )
          expected_name = f"Audio2Face {os.environ['RELEASE_TAG']}"
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("created draft returned an unexpected tag")
          if release.get("target_commitish") != os.environ["SOURCE_SHA"]:
              raise SystemExit("created draft returned an unexpected target commit")
          if release.get("name") != expected_name:
              raise SystemExit(f"created draft returned an unexpected name: {release.get('name')!r}")
          if release.get("draft") is not True or release.get("prerelease") is not False:
              raise SystemExit("created release is not the expected full draft")
          release_id = release.get("id")
          if isinstance(release_id, bool) or not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit(f"created draft has invalid release ID {release_id!r}")
          print(release_id, end="")
          PY
            )"
            rm -f -- "$created_json"
          fi
          rm -f -- "$releases_json"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build Windows x64 extension
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      asset_sha256: ${{ steps.upload.outputs.sha256 }}
      asset_size: ${{ steps.upload.outputs.size }}
    env:
      ASSET_NAME: ${{ needs.prepare.outputs.windows_asset }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out frozen release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Reclaim standard Windows runner disk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $separator = [System.IO.Path]::DirectorySeparatorChar
          $expectedToolCache = [System.IO.Path]::GetFullPath("C:\hostedtoolcache\windows").TrimEnd($separator)
          $actualToolCache = [System.IO.Path]::GetFullPath($env:RUNNER_TOOL_CACHE).TrimEnd($separator)
          if ($actualToolCache -cne $expectedToolCache) {
            throw "Unexpected Windows runner tool cache: $actualToolCache"
          }
          $targets = @(
            "C:\Program Files (x86)\Android\android-sdk",
            "C:\ghcup",
            "C:\Miniconda",
            "C:\msys64",
            "C:\vcpkg",
            "C:\Program Files\dotnet",
            $actualToolCache
          )
          foreach ($target in $targets) {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          $drive = [System.IO.DriveInfo]::new(
            [System.IO.Path]::GetPathRoot([System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE))
          )
          Write-Host "Windows runner free bytes after cleanup: $($drive.AvailableFreeSpace)"

      - name: Select release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install locked Visual Studio 2022 build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bootstrapper = Join-Path $env:RUNNER_TEMP "vs_buildtools.exe"
          $installPath = "C:\a2f-vs2022"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $bootstrapper
          $arguments = @(
            "--quiet",
            "--wait",
            "--norestart",
            "--nocache",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.VC.14.43.17.13.x86.x64",
            "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621"
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Build Tools installation failed with exit code $($process.ExitCode)"
          }
          Remove-Item -LiteralPath $bootstrapper -Force
          $compiler = Join-Path $installPath "VC\Tools\MSVC\14.43.34808\bin\Hostx64\x64\cl.exe"
          $vcvarsall = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          $sdk = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Lib\10.0.22621.0"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Locked MSVC compiler is missing after installation: $compiler"
          }
          if (-not (Test-Path -LiteralPath $vcvarsall -PathType Leaf)) {
            throw "Visual Studio C++ build environment is missing after installation: $vcvarsall"
          }
          if (-not (Test-Path -LiteralPath $sdk -PathType Container)) {
            throw "Locked Windows SDK is missing after installation: $sdk"
          }

      - name: Verify standard Windows release host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ENVIRONMENT -cne "github-hosted") {
            throw "Release requires a standard GitHub-hosted Windows runner"
          }
          if ($env:PROCESSOR_ARCHITECTURE -cne "AMD64") {
            throw "Release requires Windows x64; got $env:PROCESSOR_ARCHITECTURE"
          }
          $required = 12GB
          $roots = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP) |
            ForEach-Object { [System.IO.Path]::GetPathRoot([System.IO.Path]::GetFullPath($_)) } |
            Sort-Object -Unique
          foreach ($root in $roots) {
            $drive = [System.IO.DriveInfo]::new($root)
            if ($drive.AvailableFreeSpace -lt $required) {
              throw "$root has $($drive.AvailableFreeSpace) free bytes after cleanup; the release build requires at least $required"
            }
          }
          Get-Command git.exe -ErrorAction Stop | Out-Null
          Get-Command gh.exe -ErrorAction Stop | Out-Null

      - name: Build pinned Windows runtime
        shell: pwsh
        run: |
          python tools/build_runtime.py --platform windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Windows runtime build failed with exit code $LASTEXITCODE" }

      - name: Download verified Blender 5.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "blender-5.2.0-windows-x64"
          $archive = Join-Path $env:RUNNER_TEMP "$name-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.zip"
          $destination = Join-Path $env:RUNNER_TEMP "$name-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Invoke-WebRequest -Uri "https://download.blender.org/release/Blender5.2/$name.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "2d184b626c001692c362291911293b6a297179d618d95e9e9192c3a80318adc4"
          if ($actual -cne $expected) {
            throw "Blender archive SHA-256 mismatch: expected $expected, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $blender = Join-Path $destination "$name\blender.exe"
          if (-not (Test-Path -LiteralPath $blender -PathType Leaf)) {
            throw "Blender executable is missing after extraction: $blender"
          }
          Remove-Item -LiteralPath $archive -Force
          "BLENDER_EXECUTABLE=$blender" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Blender source smoke test
        shell: pwsh
        run: |
          & $env:BLENDER_EXECUTABLE --factory-startup --background --python tests/blender_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Blender smoke test failed with exit code $LASTEXITCODE" }

      - name: Build Windows extension
        shell: pwsh
        run: |
          python tools/build_extension.py --blender $env:BLENDER_EXECUTABLE --platform windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Windows extension build failed with exit code $LASTEXITCODE" }

      - name: Upload Windows asset to draft release
        id: upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve prepared release ID $env:RELEASE_ID" }
          $release = $releaseJson | ConvertFrom-Json
          if ([string]$release.id -cne $env:RELEASE_ID -or
              $release.tag_name -cne $env:RELEASE_TAG -or
              $release.target_commitish -cne $env:SOURCE_SHA -or
              $release.draft -cne $true -or
              $release.prerelease -cne $false) {
            throw "Prepared draft release identity changed before Windows upload"
          }
          $asset = Join-Path $env:GITHUB_WORKSPACE "dist\$env:ASSET_NAME"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw "Expected release asset is missing: $asset"
          }
          $size = (Get-Item -LiteralPath $asset).Length
          if ($size -lt 1 -or $size -ge 2147483648) {
            throw "GitHub release asset must be non-empty and smaller than 2 GiB; got $size bytes"
          }
          $sha256 = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetsJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Cannot list draft assets for release $env:RELEASE_ID" }
          $existing = @($assetsJson | ConvertFrom-Json | Where-Object { $_.name -ceq $env:ASSET_NAME })
          if ($existing.Count -gt 1) {
            throw "Draft contains duplicate assets named $env:ASSET_NAME"
          }
          if ($existing.Count -eq 1) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($existing[0].id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Cannot replace existing draft asset $env:ASSET_NAME" }
          }
          $encodedName = [Uri]::EscapeDataString($env:ASSET_NAME)
          $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$encodedName"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $response = Invoke-WebRequest `
            -UseBasicParsing `
            -Method Post `
            -Uri $uploadUrl `
            -Headers $headers `
            -ContentType "application/octet-stream" `
            -InFile $asset
          $uploaded = $response.Content | ConvertFrom-Json
          if ($uploaded.name -cne $env:ASSET_NAME -or
              $uploaded.state -cne "uploaded" -or
              [long]$uploaded.size -ne $size -or
              $uploaded.digest -cne "sha256:$sha256") {
            throw "GitHub returned an unexpected Windows asset identity"
          }
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build_linux:
    name: Build Linux x64 extension
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      asset_sha256: ${{ steps.upload.outputs.sha256 }}
      asset_size: ${{ steps.upload.outputs.size }}
    env:
      ASSET_NAME: ${{ needs.prepare.outputs.linux_asset }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Check out frozen release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Reclaim standard Ubuntu runner disk
        shell: bash
        run: |
          set -euo pipefail
          tool_cache="$(readlink --canonicalize -- "$RUNNER_TOOL_CACHE")"
          if [[ "$tool_cache" != "/opt/hostedtoolcache" ]]; then
            echo "Unexpected Ubuntu runner tool cache: $tool_cache" >&2
            exit 1
          fi
          targets=(
            /usr/local/lib/android
            /usr/local/.ghcup
            /usr/share/dotnet
            /usr/share/swift
            /usr/local/share/vcpkg
            /usr/share/miniconda
            /home/linuxbrew/.linuxbrew
            "$tool_cache"
          )
          for target in "${targets[@]}"; do
            if [[ -e "$target" || -L "$target" ]]; then
              sudo rm -rf -- "$target"
            fi
          done
          sudo install --directory --owner="$(id --user)" --group="$(id --group)" --mode=0755 "$tool_cache"
          df --human-readable "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Select release Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Verify standard Ubuntu release host
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ENVIRONMENT" != "github-hosted" ]]; then
            echo "Release requires a standard GitHub-hosted Ubuntu runner" >&2
            exit 1
          fi
          if [[ "$(uname --machine)" != "x86_64" ]]; then
            echo "Release requires Linux x64; got $(uname --machine)" >&2
            exit 1
          fi
          required=$((12 * 1024 * 1024 * 1024))
          while IFS= read -r path; do
            available="$(df --output=avail --block-size=1 "$path" | tail -n 1 | tr -d ' ')"
            if [[ ! "$available" =~ ^[0-9]+$ ]] || (( available < required )); then
              echo "$path has ${available:-unknown} free bytes after cleanup; the release build requires at least $required" >&2
              exit 1
            fi
          done < <(printf '%s\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | sort -u)
          command -v git
          command -v docker
          command -v gh
          docker version

      - name: Build pinned Linux runtime
        shell: bash
        run: python tools/build_runtime.py --platform linux-x64

      - name: Download verified Blender 5.2.0
        shell: bash
        run: |
          set -euo pipefail
          name="blender-5.2.0-linux-x64"
          archive="$RUNNER_TEMP/$name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.xz"
          destination="$RUNNER_TEMP/$name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --location --retry 5 --output "$archive" \
            "https://download.blender.org/release/Blender5.2/$name.tar.xz"
          printf '%s  %s\n' \
            "96f6c181a30f4950607839dc84d42a354b250d8a0231b098b59b7bc69c351c48" \
            "$archive" | sha256sum --check --strict
          mkdir "$destination"
          tar --extract --xz --file "$archive" --directory "$destination"
          rm -f -- "$archive"
          blender="$destination/$name/blender"
          test -x "$blender"
          printf 'BLENDER_EXECUTABLE=%s\n' "$blender" >> "$GITHUB_ENV"

      - name: Run Blender source smoke test
        shell: bash
        run: "$BLENDER_EXECUTABLE --factory-startup --background --python tests/blender_smoke.py"

      - name: Build Linux extension
        shell: bash
        run: python tools/build_extension.py --blender "$BLENDER_EXECUTABLE" --platform linux-x64

      - name: Upload Linux asset to draft release
        id: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '[.id, .tag_name, .target_commitish, .draft, .prerelease] | @tsv'
          )"
          IFS=$'\t' read -r current_release_id current_tag release_target draft prerelease <<< "$release"
          if [[ "$current_release_id" != "$RELEASE_ID" || "$current_tag" != "$RELEASE_TAG" ||
                "$release_target" != "$SOURCE_SHA" || "$draft" != "true" ||
                "$prerelease" != "false" ]]; then
            echo "Prepared draft release identity changed before Linux upload." >&2
            exit 1
          fi
          asset="$GITHUB_WORKSPACE/dist/$ASSET_NAME"
          test -f "$asset"
          size="$(stat --format=%s "$asset")"
          if (( size < 1 || size >= 2147483648 )); then
            echo "GitHub release asset must be non-empty and smaller than 2 GiB; got $size bytes" >&2
            exit 1
          fi
          sha256="$(sha256sum "$asset" | cut --delimiter=' ' --fields=1)"
          assets_json="$RUNNER_TEMP/linux-release-assets.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > "$assets_json"
          existing_id="$(ASSETS_JSON="$assets_json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          assets = json.loads(Path(os.environ["ASSETS_JSON"]).read_text(encoding="utf-8"))
          if not isinstance(assets, list):
              raise SystemExit("Draft assets response is not an array")
          matches = [asset for asset in assets if asset.get("name") == os.environ["ASSET_NAME"]]
          if len(matches) > 1:
              raise SystemExit(f"Draft contains duplicate assets named {os.environ['ASSET_NAME']}")
          if matches:
              asset_id = matches[0].get("id")
              if isinstance(asset_id, bool) or not isinstance(asset_id, int) or asset_id <= 0:
                  raise SystemExit(f"Existing draft asset has invalid ID {asset_id!r}")
              print(asset_id, end="")
          PY
          )"
          if [[ -n "$existing_id" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" > /dev/null
          fi
          uploaded_json="$RUNNER_TEMP/linux-uploaded-asset.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/octet-stream" \
            --upload-file "$asset" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME" \
            > "$uploaded_json"
          UPLOADED_JSON="$uploaded_json" \
          EXPECTED_SIZE="$size" \
          EXPECTED_SHA256="$sha256" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          asset = json.loads(
              Path(os.environ["UPLOADED_JSON"]).read_text(encoding="utf-8")
          )
          expected = {
              "name": os.environ["ASSET_NAME"],
              "state": "uploaded",
              "size": int(os.environ["EXPECTED_SIZE"]),
              "digest": f"sha256:{os.environ['EXPECTED_SHA256']}",
          }
          actual = {key: asset.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"GitHub returned an unexpected Linux asset identity: {actual!r}")
          PY
          rm -f -- "$assets_json" "$uploaded_json"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'size=%s\n' "$size" >> "$GITHUB_OUTPUT"

  publish:
    name: Verify and publish release
    needs:
      - prepare
      - build_windows
      - build_linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INDEX_ASSET: index.json
      LINUX_ASSET: ${{ needs.prepare.outputs.linux_asset }}
      LINUX_SHA256: ${{ needs.build_linux.outputs.asset_sha256 }}
      LINUX_SIZE: ${{ needs.build_linux.outputs.asset_size }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      WINDOWS_ASSET: ${{ needs.prepare.outputs.windows_asset }}
      WINDOWS_SHA256: ${{ needs.build_windows.outputs.asset_sha256 }}
      WINDOWS_SIZE: ${{ needs.build_windows.outputs.asset_size }}
    steps:
      - name: Check out frozen release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Build and upload Blender repository index
        id: repository_index
        shell: bash
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/$INDEX_ASSET"
          python tools/build_repository_index.py \
            --manifest audio2face/blender_manifest.toml \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --windows-name "$WINDOWS_ASSET" \
            --windows-size "$WINDOWS_SIZE" \
            --windows-sha256 "$WINDOWS_SHA256" \
            --linux-name "$LINUX_ASSET" \
            --linux-size "$LINUX_SIZE" \
            --linux-sha256 "$LINUX_SHA256" \
            --output "$index"

          release="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --jq '[.id, .tag_name, .target_commitish, .draft, .prerelease] | @tsv'
          )"
          IFS=$'\t' read -r current_id current_tag current_target draft prerelease <<< "$release"
          if [[ "$current_id" != "$RELEASE_ID" || "$current_tag" != "$RELEASE_TAG" ||
                "$current_target" != "$SOURCE_SHA" || "$draft" != "true" ||
                "$prerelease" != "false" ]]; then
            echo "Prepared draft identity changed before repository index upload." >&2
            exit 1
          fi

          existing_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq 'map(select(.name == "index.json")) |
                if length > 1 then error("duplicate index.json assets")
                elif length == 1 then .[0].id else "" end'
          )"
          if [[ -n "$existing_id" ]]; then
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" > /dev/null
          fi

          size="$(stat --format=%s "$index")"
          sha256="$(sha256sum "$index" | cut --delimiter=' ' --fields=1)"
          uploaded="$RUNNER_TEMP/uploaded-index.json"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --upload-file "$index" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$INDEX_ASSET" \
            > "$uploaded"
          UPLOADED_JSON="$uploaded" EXPECTED_SIZE="$size" EXPECTED_SHA256="$sha256" \
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          uploaded = json.loads(
              Path(os.environ["UPLOADED_JSON"]).read_text(encoding="utf-8")
          )
          expected = {
              "name": os.environ["INDEX_ASSET"],
              "state": "uploaded",
              "size": int(os.environ["EXPECTED_SIZE"]),
              "digest": f"sha256:{os.environ['EXPECTED_SHA256']}",
          }
          actual = {key: uploaded.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"GitHub returned an unexpected index asset: {actual!r}")
          PY
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'size=%s\n' "$size" >> "$GITHUB_OUTPUT"

      - name: Verify exact draft assets
        shell: bash
        env:
          INDEX_SHA256: ${{ steps.repository_index.outputs.sha256 }}
          INDEX_SIZE: ${{ steps.repository_index.outputs.size }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ["RUNNER_TEMP"], "release.json").read_text())
          if release.get("id") != int(os.environ["RELEASE_ID"]):
              raise SystemExit("draft release ID does not match the prepared release")
          if release.get("tag_name") != os.environ["RELEASE_TAG"]:
              raise SystemExit("draft release tag does not match the workflow tag")
          if release.get("target_commitish") != os.environ["SOURCE_SHA"]:
              raise SystemExit("draft release target does not match the dated manifest commit")
          if release.get("draft") is not True:
              raise SystemExit("release is no longer a draft")
          if release.get("prerelease") is not False:
              raise SystemExit("draft release unexpectedly became a prerelease")
          expected_name = f"Audio2Face {os.environ['RELEASE_TAG']}"
          if release.get("name") != expected_name:
              raise SystemExit(
                  f"draft release name must be {expected_name!r}; got {release.get('name')!r}"
              )
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("release assets are not an array")
          expected = {
              os.environ["INDEX_ASSET"]: {
                  "size": int(os.environ["INDEX_SIZE"]),
                  "digest": f"sha256:{os.environ['INDEX_SHA256']}",
              },
              os.environ["WINDOWS_ASSET"]: {
                  "size": int(os.environ["WINDOWS_SIZE"]),
                  "digest": f"sha256:{os.environ['WINDOWS_SHA256']}",
              },
              os.environ["LINUX_ASSET"]: {
                  "size": int(os.environ["LINUX_SIZE"]),
                  "digest": f"sha256:{os.environ['LINUX_SHA256']}",
              },
          }
          actual = {
              asset.get("name"): asset
              for asset in assets
              if isinstance(asset, dict) and isinstance(asset.get("name"), str)
          }
          if set(actual) != set(expected) or len(assets) != len(expected):
              raise SystemExit(
                  f"draft release must contain exactly {sorted(expected)}; got {sorted(actual)}"
              )
          for name, identity in expected.items():
              asset = actual[name]
              size = asset.get("size")
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"release asset is not uploaded: {name!r}")
              if size != identity["size"] or not 0 < identity["size"] < 2**31:
                  raise SystemExit(
                      f"release asset size differs from native build: {name!r}: "
                      f"{size!r} != {identity['size']!r}"
                  )
              if asset.get("digest") != identity["digest"]:
                  raise SystemExit(
                      f"release asset digest differs from native build: {name!r}: "
                      f"{asset.get('digest')!r} != {identity['digest']!r}"
                  )
          PY

      - name: Create or verify dated release tag
        shell: bash
        run: |
          set -euo pipefail
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          qualified_tag="refs/tags/$RELEASE_TAG"

          query_tag() {
            # shellcheck disable=SC2016
            gh api graphql \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f qualified="$qualified_tag" \
              -f query='query($owner: String!, $name: String!, $qualified: String!) {
                repository(owner: $owner, name: $name) {
                  ref(qualifiedName: $qualified) { target { __typename oid } }
                }
              }' \
              --jq '.data.repository.ref.target // {} |
                if .oid == null then "" else [.__typename, .oid] | @tsv end'
          }

          tag_state="$(query_tag)"
          if [[ -z "$tag_state" ]]; then
            create_error="$RUNNER_TEMP/create-release-tag-error.txt"
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="$qualified_tag" \
              --raw-field sha="$SOURCE_SHA" \
              > /dev/null 2> "$create_error"; then
              tag_state="$(query_tag)"
              IFS=$'\t' read -r raced_type raced_sha <<< "$tag_state"
              if [[ "$raced_type" != "Commit" || "$raced_sha" != "$SOURCE_SHA" ]]; then
                cat "$create_error" >&2
                exit 1
              fi
            fi
            rm -f -- "$create_error"
          fi
          tag_state="$(query_tag)"
          IFS=$'\t' read -r object_type current_sha <<< "$tag_state"
          if [[ "$object_type" != "Commit" || "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Release tag must be a lightweight tag at $SOURCE_SHA; got $object_type $current_sha." >&2
            exit 1
          fi

      - name: Publish verified release and dated tag
        shell: bash
        run: |
          set -euo pipefail
          published_json="$RUNNER_TEMP/published-release.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --field draft=false \
            --field prerelease=false \
            --raw-field make_latest=true > "$published_json"
          PUBLISHED_JSON="$published_json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(
              Path(os.environ["PUBLISHED_JSON"]).read_text(encoding="utf-8")
          )
          expected = {
              "id": int(os.environ["RELEASE_ID"]),
              "tag_name": os.environ["RELEASE_TAG"],
              "target_commitish": os.environ["SOURCE_SHA"],
              "name": f"Audio2Face {os.environ['RELEASE_TAG']}",
              "draft": False,
              "prerelease": False,
          }
          actual = {key: release.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f"Published release identity differs from verified draft: {actual!r}")
          PY
          rm -f -- "$published_json"
          published_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object | [.type, .sha] | @tsv'
          )"
          IFS=$'\t' read -r object_type published_sha <<< "$published_tag"
          if [[ "$object_type" != "commit" || "$published_sha" != "$SOURCE_SHA" ]]; then
            echo "Published tag must be a lightweight tag at $SOURCE_SHA; got $object_type $published_sha." >&2
            exit 1
          fi
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          # shellcheck disable=SC2016
          latest_tag="$(
            gh api graphql \
              -f owner="$repository_owner" \
              -f name="$repository_name" \
              -f query='query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  latestRelease { tagName }
                }
              }' \
              --jq '.data.repository.latestRelease.tagName // ""'
          )"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Published release was not marked Latest: expected $RELEASE_TAG, got ${latest_tag:-missing}." >&2
            exit 1
          fi
