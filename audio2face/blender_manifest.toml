schema_version = "1.0.0"

id = "audio2face"
version = "2026.8.21"
name = "Audio2Face"
tagline = "Drive target meshes with GPU-generated ARKit-52 values"
maintainer = "x.com/BruzWJ"
type = "add-on"

tags = ["Animation"]
blender_version_min = "5.2.0"
blender_version_max = "5.3.0"
platforms = ["windows-x64", "linux-x64"]
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read WAV and model folders; write TensorRT engines"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.py[cod]",
  "/.git/",
  "/*.zip",
]
