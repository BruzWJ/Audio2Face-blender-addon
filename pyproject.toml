[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "a2f-blender-dev"
version = "0.1.0"
description = "Development and tests for the Audio2Face Blender extension"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

